version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heatline
      POSTGRES_PASSWORD: heatline
      POSTGRES_DB: heatline
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://heatline:heatline@postgres:5432/heatline
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.seed_demo && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pg_data: